<!doctype html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Universal Solutions | The People Behind Your Operations</title>

<meta
  name="description"
  content="Universal Solutions provides reliable business operations support across customer experience, finance, data, administration, and 24/7 operational coverage. Support starting from USD 6/hour."
>

<link rel="icon" href="images/logo.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
  href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
  rel="stylesheet"
>

<style>

:root {
  --navy-deep: #14213D;
  --navy-midnight: #0B1626;
  --teal: #1CA9A0;
  --cyan-bright: #3FD3C6;
  --bg: #F7F9FB;
  --ink: #4A5568;
  --border: #E2E8F0;
  --white: #FFFFFF;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--navy-deep);
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}

a {
  text-decoration: none;
  color: inherit;
}

.container {
  max-width: 1140px;
  margin: 0 auto;
  padding: 0 24px;
}

/* =========================
   HEADER
========================= */

header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(247,249,251,0.94);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid rgba(20,33,61,0.06);
  transition: box-shadow 0.25s ease;
}

header.scrolled {
  box-shadow: 0 8px 24px rgba(20,33,61,0.08);
}

header .container {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 74px;
  gap: 24px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: 'Fraunces', serif;
  font-weight: 600;
  font-size: 1.02rem;
  white-space: nowrap;
}

.brand img {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  object-fit: cover;
}

nav {
  display: flex;
  align-items: center;
  gap: 28px;
}

nav a {
  position: relative;
  padding: 4px 0;
  font-size: 0.95rem;
  font-weight: 500;
}

nav a::after {
  content: '';
  position: absolute;
  left: 0;
  bottom: 0;
  width: 0;
  height: 2px;
  background: var(--teal);
  transition: width 0.25s ease;
}

nav a:hover::after {
  width: 100%;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 13px 28px;
  border-radius: 999px;
  font-size: 0.95rem;
  font-weight: 600;
  border: none;
  cursor: pointer;
  transition:
    transform 0.2s ease,
    box-shadow 0.2s ease;
}

.btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 26px rgba(20,33,61,0.16);
}

.btn-primary {
  background: linear-gradient(
    120deg,
    var(--teal),
    var(--cyan-bright)
  );
  color: var(--navy-midnight);
}

.btn-outline {
  border: 1.5px solid var(--navy-deep);
  color: var(--navy-deep);
  background: transparent;
}

.btn-ghost {
  color: #fff;
  border: 1.5px solid rgba(255,255,255,0.42);
  background: rgba(255,255,255,0.04);
}

/* =========================
   HERO
========================= */

.hero {
  position: relative;
  min-height: 680px;
  display: flex;
  align-items: center;
  overflow: hidden;
  color: #fff;
  background: var(--navy-midnight);
}

.hero-video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: 0;
}

.hero-overlay {
  position: absolute;
  inset: 0;
  z-index: 1;

  background:
    linear-gradient(
      90deg,
      rgba(7,17,31,0.93) 0%,
      rgba(11,22,38,0.82) 45%,
      rgba(11,22,38,0.50) 100%
    );
}

.hero .container {
  position: relative;
  z-index: 2;
  padding-top: 70px;
  padding-bottom: 70px;
}

.eyebrow {
  display: inline-block;
  margin-bottom: 16px;
  color: var(--cyan-bright);
  font-size: 0.78rem;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
}

.hero h1 {
  max-width: 820px;
  margin-bottom: 22px;
  font-family: 'Fraunces', serif;
  font-size: clamp(2.6rem, 6vw, 4.7rem);
  font-weight: 600;
  line-height: 1.05;
}

.hero .lead {
  max-width: 710px;
  margin-bottom: 30px;
  color: rgba(255,255,255,0.82);
  font-size: 1.08rem;
}

.hero-actions {
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
  margin-bottom: 22px;
}

.hero-contact {
  display: flex;
  align-items: center;
  gap: 22px;
  flex-wrap: wrap;
  margin-bottom: 22px;
}

.hero-contact a {
  color: rgba(255,255,255,0.90);
  font-size: 0.9rem;
  font-weight: 600;
}

.hero-contact a:hover {
  color: var(--cyan-bright);
}

.price-note {
  display: inline-flex;
  align-items: center;
  padding: 10px 18px;
  border: 1px solid rgba(255,255,255,0.16);
  border-radius: 999px;
  background: rgba(255,255,255,0.07);
  color: rgba(255,255,255,0.78);
  font-size: 0.88rem;
}

.price-note strong {
  color: var(--cyan-bright);
}

/* =========================
   TRUST STRIP
========================= */

.trust-strip {
  background: #fff;
  border-bottom: 1px solid var(--border);
}

.trust-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
}

.trust-item {
  padding: 25px 18px;
  text-align: center;
  border-right: 1px solid var(--border);
}

.trust-item:last-child {
  border-right: none;
}

.trust-item strong {
  display: block;
  margin-bottom: 3px;
  font-family: 'Fraunces', serif;
  font-size: 1.25rem;
}

.trust-item span {
  color: var(--ink);
  font-size: 0.78rem;
}

/* =========================
   SECTIONS
========================= */

section.standard {
  padding: 88px 0;
}

.section-heading {
  max-width: 760px;
  margin-bottom: 42px;
}

.section-heading.center {
  margin-left: auto;
  margin-right: auto;
  text-align: center;
}

.section-heading h2 {
  margin-bottom: 13px;
  font-family: 'Fraunces', serif;
  font-size: clamp(2rem, 4vw, 2.8rem);
  line-height: 1.15;
}

.section-heading p {
  color: var(--ink);
  font-size: 1rem;
}

/* =========================
   SERVICES
========================= */

.services-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 20px;
}

.service-card {
  display: flex;
  flex-direction: column;
  min-height: 250px;
  padding: 28px 24px;
  border: 1px solid var(--border);
  border-radius: 16px;
  background: #fff;
  transition:
    transform 0.2s ease,
    box-shadow 0.2s ease,
    border-color 0.2s ease;
}

.service-card:hover {
  transform: translateY(-5px);
  border-color: rgba(28,169,160,0.30);
  box-shadow: 0 16px 35px rgba(20,33,61,0.08);
}

.service-icon {
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 20px;
  border-radius: 12px;
  background: linear-gradient(
    135deg,
    var(--navy-deep),
    var(--teal)
  );
  color: #fff;
  font-size: 1.05rem;
}

.service-card h3 {
  margin-bottom: 9px;
  font-family: 'Fraunces', serif;
  font-size: 1.28rem;
  line-height: 1.2;
}

.service-card p {
  color: var(--ink);
  font-size: 0.86rem;
}

.service-card a {
  margin-top: auto;
  padding-top: 18px;
  color: var(--teal);
  font-size: 0.82rem;
  font-weight: 700;
}

/* =========================
   WHY US
========================= */

.why-section {
  background: #fff;
}

.why-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
}

.why-card {
  padding: 32px;
  border: 1px solid var(--border);
  border-radius: 17px;
  background: var(--bg);
}

.why-card h3 {
  margin-bottom: 9px;
  font-family: 'Fraunces', serif;
  font-size: 1.4rem;
}

.why-card p {
  color: var(--ink);
  font-size: 0.9rem;
}

.why-feature {
  grid-column: 1 / -1;
  display: grid;
  grid-template-columns: 1fr 0.8fr;
  gap: 35px;
  padding: 38px;
  border-radius: 18px;
  color: #fff;

  background:
    radial-gradient(
      circle at 90% 10%,
      rgba(63,211,198,0.16),
      transparent 32%
    ),
    linear-gradient(
      135deg,
      var(--navy-midnight),
      var(--navy-deep)
    );
}

.why-feature h3 {
  margin-bottom: 12px;
  font-family: 'Fraunces', serif;
  font-size: 1.9rem;
}

.why-feature p {
  color: rgba(255,255,255,0.73);
  font-size: 0.92rem;
}

.feature-points {
  display: grid;
  gap: 12px;
}

.feature-point {
  padding: 14px 16px;
  border: 1px solid rgba(255,255,255,0.10);
  border-radius: 11px;
  background: rgba(255,255,255,0.045);
  color: rgba(255,255,255,0.82);
  font-size: 0.84rem;
}

/* =========================
   INDUSTRIES
========================= */

.industry-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 15px;
}

.industry-card {
  padding: 23px 18px;
  border: 1px solid var(--border);
  border-radius: 13px;
  background: #fff;
  text-align: center;
  font-weight: 600;
  font-size: 0.86rem;
  transition:
    transform 0.2s ease,
    box-shadow 0.2s ease;
}

.industry-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 12px 26px rgba(20,33,61,0.07);
}

.industry-dot {
  width: 9px;
  height: 9px;
  display: block;
  margin: 0 auto 12px;
  border-radius: 50%;
  background: var(--teal);
}

/* =========================
   LUXURY TRANSPORTATION
========================= */

.luxury-section {
  background: var(--navy-midnight);
  color: #fff;
}

.luxury-grid {
  display: grid;
  grid-template-columns: 1.15fr 0.85fr;
  gap: 55px;
  align-items: center;
}

.luxury-section .section-heading {
  margin-bottom: 24px;
}

.luxury-section .section-heading h2 {
  color: #fff;
}

.luxury-section .section-heading p {
  color: rgba(255,255,255,0.72);
}

.luxury-list {
  display: grid;
  gap: 12px;
  margin-top: 22px;
  list-style: none;
}

.luxury-list li {
  position: relative;
  padding-left: 23px;
  color: rgba(255,255,255,0.82);
  font-size: 0.88rem;
}

.luxury-list li::before {
  content: '✓';
  position: absolute;
  left: 0;
  color: var(--cyan-bright);
  font-weight: 700;
}

.luxury-card {
  padding: 32px;
  border: 1px solid rgba(255,255,255,0.11);
  border-radius: 17px;
  background: rgba(255,255,255,0.045);
}

.luxury-card .label {
  margin-bottom: 9px;
  color: var(--cyan-bright);
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.luxury-card h3 {
  margin-bottom: 11px;
  font-family: 'Fraunces', serif;
  font-size: 1.7rem;
}

.luxury-card p {
  margin-bottom: 22px;
  color: rgba(255,255,255,0.69);
  font-size: 0.86rem;
}

/* =========================
   SUPPORT MODELS
========================= */

.model-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 22px;
}

.model-card {
  padding: 30px;
  border: 1px solid var(--border);
  border-radius: 16px;
  background: #fff;
}

.model-card h3 {
  margin-bottom: 9px;
  font-family: 'Fraunces', serif;
  font-size: 1.4rem;
}

.model-card p {
  color: var(--ink);
  font-size: 0.89rem;
}

/* =========================
   HOW IT WORKS
========================= */

.how-section {
  background: #fff;
}

.steps {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 20px;
}

.step {
  position: relative;
  padding: 28px 22px;
  border: 1px solid var(--border);
  border-radius: 15px;
  background: var(--bg);
}

.step-number {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 38px;
  height: 38px;
  margin-bottom: 17px;
  border-radius: 50%;
  background: rgba(28,169,160,0.11);
  color: var(--teal);
  font-size: 0.8rem;
  font-weight: 700;
}

.step h3 {
  margin-bottom: 8px;
  font-family: 'Fraunces', serif;
  font-size: 1.25rem;
}

.step p {
  color: var(--ink);
  font-size: 0.84rem;
}

/* =========================
   PRICING
========================= */

.price-section {
  padding: 80px 0;
}

.price-card {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 30px;
  align-items: center;
  padding: 42px;
  border-radius: 20px;
  color: #fff;

  background:
    radial-gradient(
      circle at 90% 10%,
      rgba(63,211,198,0.16),
      transparent 30%
    ),
    linear-gradient(
      135deg,
      var(--navy-deep),
      var(--navy-midnight)
    );
}

.price-card h2 {
  margin-bottom: 10px;
  font-family: 'Fraunces', serif;
  font-size: 2.1rem;
}

.price-card p {
  max-width: 680px;
  color: rgba(255,255,255,0.70);
  font-size: 0.9rem;
}

.price-big {
  font-family: 'Fraunces', serif;
  font-size: 2.5rem;
  font-weight: 600;
  white-space: nowrap;
  color: var(--cyan-bright);
}

.price-big span {
  display: block;
  color: rgba(255,255,255,0.60);
  font-family: 'Inter', sans-serif;
  font-size: 0.72rem;
  font-weight: 500;
  text-align: right;
}

/* =========================
   FAQ
========================= */

.faq-grid {
  display: grid;
  gap: 13px;
}

details {
  border: 1px solid var(--border);
  border-radius: 12px;
  background: #fff;
  overflow: hidden;
}

summary {
  padding: 20px 22px;
  cursor: pointer;
  font-weight: 600;
  font-size: 0.92rem;
  list-style: none;
}

summary::-webkit-details-marker {
  display: none;
}

summary::after {
  content: '+';
  float: right;
  color: var(--teal);
  font-size: 1.15rem;
}

details[open] summary::after {
  content: '−';
}

details p {
  padding: 0 22px 20px;
  color: var(--ink);
  font-size: 0.87rem;
}

/* =========================
   CTA
========================= */

.cta-section {
  padding: 20px 0 100px;
}

.cta {
  padding: 60px 40px;
  border-radius: 20px;
  text-align: center;
  color: #fff;

  background:
    radial-gradient(
      circle at 85% 10%,
      rgba(63,211,198,0.14),
      transparent 32%
    ),
    linear-gradient(
      135deg,
      var(--navy-midnight),
      var(--navy-deep)
    );
}

.cta h2 {
  margin-bottom: 12px;
  font-family: 'Fraunces', serif;
  font-size: clamp(2rem, 4vw, 2.7rem);
}

.cta p {
  max-width: 650px;
  margin: 0 auto 26px;
  color: rgba(255,255,255,0.73);
  font-size: 0.94rem;
}

.cta-actions {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 13px;
  flex-wrap: wrap;
}

/* =========================
   FOOTER
========================= */

footer {
  padding: 48px 0;
  background: var(--navy-midnight);
  color: rgba(255,255,255,0.60);
  font-size: 0.84rem;
}

.footer-grid {
  display: grid;
  grid-template-columns: 1.4fr 1fr 1fr 1.2fr;
  gap: 35px;
  padding-bottom: 35px;
  border-bottom: 1px solid rgba(255,255,255,0.09);
}

.footer-brand {
  font-family: 'Fraunces', serif;
  color: #fff;
  font-size: 1.15rem;
  margin-bottom: 10px;
}

.footer-description {
  max-width: 300px;
  color: rgba(255,255,255,0.56);
  font-size: 0.82rem;
}

.footer-column h4 {
  margin-bottom: 12px;
  color: #fff;
  font-size: 0.83rem;
}

.footer-column a {
  display: block;
  margin-bottom: 8px;
  color: rgba(255,255,255,0.60);
  font-size: 0.81rem;
}

.footer-column a:hover {
  color: var(--cyan-bright);
}

.footer-bottom {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  padding-top: 24px;
}

.footer-bottom a {
  color: rgba(255,255,255,0.70);
}

/* =========================
   FLOATING CONTACT BUTTONS
========================= */

.contact-floats {
  position: fixed;
  right: 20px;
  bottom: 20px;
  z-index: 200;

  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 10px;
}

.float-btn {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 12px 17px;
  border-radius: 999px;
  color: #fff;
  font-size: 0.84rem;
  font-weight: 700;
  box-shadow: 0 10px 25px rgba(0,0,0,0.18);
  transition:
    transform 0.2s ease,
    box-shadow 0.2s ease;
}

.float-btn:hover {
  transform: translateY(-3px);
  box-shadow: 0 15px 30px rgba(0,0,0,0.22);
}

.float-whatsapp {
  background: #25D366;
}

.float-call {
  background: var(--navy-deep);
}

.float-icon {
  font-size: 1.05rem;
}

/* =========================
   REVEAL
========================= */

.reveal {
  opacity: 0;
  transform: translateY(18px);
  transition:
    opacity 0.6s ease,
    transform 0.6s ease;
}

.reveal.visible {
  opacity: 1;
  transform: translateY(0);
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 1050px) {

  nav {
    gap: 18px;
  }

  .services-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .industry-grid {
    grid-template-columns: repeat(3, 1fr);
  }

  .steps {
    grid-template-columns: repeat(2, 1fr);
  }

  .footer-grid {
    grid-template-columns: repeat(2, 1fr);
  }

}

@media (max-width: 850px) {

  .luxury-grid {
    grid-template-columns: 1fr;
  }

  .why-feature {
    grid-template-columns: 1fr;
  }

  .model-grid {
    grid-template-columns: 1fr;
  }

  .price-card {
    grid-template-columns: 1fr;
  }

  .price-big span {
    text-align: left;
  }

}

@media (max-width: 760px) {

  header .container {
    min-height: 68px;
  }

  nav {
    display: none;
  }

  .brand {
    font-size: 0.98rem;
  }

  header .btn-outline {
    padding: 10px 17px;
    font-size: 0.82rem;
  }

  .hero {
    min-height: 640px;
  }

  .hero-overlay {
    background:
      linear-gradient(
        90deg,
        rgba(7,17,31,0.94),
        rgba(11,22,38,0.72)
      );
  }

  .hero .container {
    padding-top: 60px;
    padding-bottom: 60px;
  }

  .hero h1 {
    font-size: 2.8rem;
  }

  .hero .lead {
    font-size: 0.98rem;
  }

  .trust-grid {
    grid-template-columns: 1fr 1fr;
  }

  .trust-item:nth-child(2) {
    border-right: none;
  }

  .trust-item:nth-child(-n+2) {
    border-bottom: 1px solid var(--border);
  }

  section.standard {
    padding: 65px 0;
  }

  .services-grid {
    grid-template-columns: 1fr;
  }

  .industry-grid {
    grid-template-columns: 1fr 1fr;
  }

  .steps {
    grid-template-columns: 1fr;
  }

  .footer-grid {
    grid-template-columns: 1fr 1fr;
  }

}

@media (max-width: 520px) {

  .container {
    padding-left: 18px;
    padding-right: 18px;
  }

  .hero {
    min-height: 680px;
  }

  .hero h1 {
    font-size: 2.45rem;
  }

  .hero-actions {
    flex-direction: column;
    align-items: stretch;
  }

  .hero-actions .btn {
    width: 100%;
  }

  .hero-contact {
    flex-direction: column;
    align-items: flex-start;
    gap: 10px;
  }

  .price-note {
    font-size: 0.78rem;
  }

  .industry-grid {
    grid-template-columns: 1fr;
  }

  .why-feature {
    padding: 28px 23px;
  }

  .luxury-card {
